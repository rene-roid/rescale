[project]
name = "rescale-tagger"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rescale-core",
    "transformers>=4.57",
    "torch>=2.0",
    "librosa>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescale_tagger"]

[tool.uv.sources]
rescale-core = { workspace = true }
