[project]
name = "rescale-scanner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rescale-core",
    "mutagen>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescale_scanner"]

[tool.uv.sources]
rescale-core = { workspace = true }
