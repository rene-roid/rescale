[project]
name = "rescale-transcriber"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rescale-core",
    "whisperx>=3.8",
    "demucs>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescale_transcriber"]

[tool.uv.sources]
rescale-core = { workspace = true }
