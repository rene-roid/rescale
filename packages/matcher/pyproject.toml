[project]
name = "rescale-matcher"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rescale-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescale_matcher"]

[tool.uv.sources]
rescale-core = { workspace = true }
