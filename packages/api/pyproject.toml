[project]
name = "rescale-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rescale-core",
    "rescale-scanner",
    "rescale-matcher",
    "rescale-rescaler",
    "rescale-transcriber",
    "rescale-writer",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
rescale = "rescale_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescale_api"]

[tool.uv.sources]
rescale-core = { workspace = true }
rescale-scanner = { workspace = true }
rescale-matcher = { workspace = true }
rescale-rescaler = { workspace = true }
rescale-transcriber = { workspace = true }
rescale-writer = { workspace = true }
