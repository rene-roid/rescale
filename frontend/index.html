<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rescale</title>
<link rel="icon" href="/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#0d0d0e; --panel:#141416; --raised:#1a1b1e; --line:#26272b; --line-soft:#1e1f22;
    --fg:#e7e7ea; --mute:#8b8d94; --dim:#5c5e64;
    --hi:#ffd166; --ok:#5fce8f; --warn:#e2a63f; --bad:#f0605c; --ai:#7aa8ff;
    --fs-1:11px; --fs-2:13px; --fs-3:15px; --fs-4:17px; --fs-5:23px;
    --sp-1:4px; --sp-2:8px; --sp-3:14px; --sp-4:20px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; }
  ::selection { background:#3a3210; color:var(--hi); }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2c2d31; border-radius:6px; border:3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#3a3b40; }
  :focus-visible { outline:2px solid var(--hi); outline-offset:1px; border-radius:3px; }

  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:var(--fs-2)/1.5 system-ui, sans-serif;
    display:grid; grid-template-rows:auto 1fr; height:100vh;
  }

  header {
    display:flex; gap:var(--sp-3); align-items:center;
    padding:var(--sp-2) var(--sp-4); background:var(--panel);
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  header h1 {
    font-size:var(--fs-4); font-weight:700; letter-spacing:-.01em;
    margin:0 var(--sp-2) 0 0; color:var(--fg);
  }
  header .counts { display:flex; flex-wrap:wrap; gap:var(--sp-3); font-size:var(--fs-1); }
  header .counts span { color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  header .counts b { color:var(--mute); font-weight:600; margin-left:3px; }
  #busy { font-size:var(--fs-1); color:var(--hi); text-transform:uppercase; letter-spacing:.04em; display:none; }
  #busy.on { display:inline; animation:pulse 1.2s ease-in-out infinite; }

  main { display:grid; grid-template-columns: minmax(0,1fr) 440px; min-height:0; }
  #list { overflow:auto; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th, td {
    text-align:left; padding:var(--sp-2) 10px; border-bottom:1px solid var(--line-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  th {
    position:sticky; top:0; background:var(--panel); color:var(--dim);
    font-weight:600; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.05em;
    box-shadow:0 1px 0 var(--line);
  }
  td { font-size:var(--fs-2); color:var(--fg); }
  td:nth-child(2) { font-variant-numeric:tabular-nums; color:var(--mute); }
  tr { transition:background-color .1s var(--ease); }
  tr:hover td { background:var(--raised); cursor:pointer; }
  tr.sel td { background:#20211f; }
  tr.sel td:first-child { box-shadow:inset 3px 0 var(--hi); }

  .st {
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 8px 2px 6px; border-radius:99px; font-size:var(--fs-1);
    font-weight:600; letter-spacing:.02em; color:#0a0a0a; background:var(--mute);
  }
  .st::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.55; }
  .st.matched-online { background:var(--ok); } .st.ai-transcribed { background:var(--ai); }
  .st.needs-review { background:var(--warn); } .st.failed { background:var(--bad); }
  .st.processing { background:var(--ai); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }

  .loading-msg { color:var(--dim); padding:var(--sp-4) var(--sp-3); font-size:var(--fs-2); }

  button, select, input {
    background:var(--raised); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:var(--sp-2) var(--sp-3); font:inherit; font-size:var(--fs-2);
    transition:background-color .12s var(--ease), border-color .12s var(--ease);
  }
  button { cursor:pointer; font-weight:500; }
  button:hover { background:#232427; border-color:#3a3b40; }
  button:active { background:#1c1d20; }
  button:disabled { opacity:.5; cursor:default; }
  input::placeholder { color:var(--dim); }
  #btn-scan { border-color:#3d3115; background:#20190a; color:#ffdd8f; }
  #btn-scan:hover { background:#2a2110; border-color:#4a3a18; }

  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside .meta { padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--line); font-size:var(--fs-2); }
  aside .meta > b:first-child { display:block; font-size:var(--fs-3); font-weight:600; margin-bottom:var(--sp-2); color:var(--fg); }
  aside .meta div { margin:5px 0; color:var(--mute); line-height:1.6; }
  aside .meta b { color:var(--fg); font-weight:600; }
  aside .actions { padding:var(--sp-3) var(--sp-4); display:flex; gap:var(--sp-2); flex-wrap:wrap; border-bottom:1px solid var(--line); }
  audio { width:100%; height:32px; }
  audio::-webkit-media-controls-panel { background:var(--raised); }

  #lyrics { overflow:auto; padding:var(--sp-3) var(--sp-4); flex:1; }
  #lyrics p {
    margin:0; padding:6px 10px; color:var(--dim); border-radius:5px; cursor:pointer;
    font-size:var(--fs-3); line-height:1.7; transition:color .15s var(--ease), background-color .15s var(--ease);
  }
  #lyrics p:hover { color:var(--mute); background:var(--raised); }
  #lyrics p.on { color:var(--hi); background:#221c0c; font-weight:600; }
  #lyrics p small { color:var(--dim); margin-right:10px; font-variant-numeric:tabular-nums; font-weight:400; font-size:var(--fs-1); }
  .err { color:var(--bad); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Rescale</h1>
  <select id="status">
    <option value="">all statuses</option>
    <option>pending</option><option>matched-online</option><option>ai-transcribed</option><option>needs-review</option><option>failed</option>
  </select>
  <input id="q" placeholder="filter by path…" size="28">
  <span class="counts" id="counts"></span>
  <span id="busy">loading…</span>
  <span style="margin-left:auto"></span>
  <button id="btn-scan" onclick="run('btn-scan', '/api/scan', 'scanning…')">rescan library</button>
  <button id="btn-pending" onclick="run('btn-pending', '/api/run?status=pending', 'running…')">run pending</button>
  <button id="btn-failed" onclick="run('btn-failed', '/api/run?status=failed', 'retrying…')">retry failed</button>
</header>
<main>
  <div id="list"><table><thead><tr><th style="width:130px">status</th><th style="width:56px">conf</th><th style="width:72px">via</th><th style="width:20%">folder</th><th>file</th><th style="width:200px">parsed</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="loading-msg">loading…</td></tr></tbody></table></div>
  <aside>
    <div class="meta" id="meta">Select a track.</div>
    <div class="actions" id="actions" hidden>
      <button onclick="reprocess('auto')">reprocess (auto)</button>
      <button onclick="reprocess('online')">use online lookup</button>
      <button onclick="reprocess('ai')">use AI transcription</button>
    </div>
    <div style="padding:8px 12px"><audio id="player" controls preload="none"></audio></div>
    <div id="lyrics"></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
let tracks = [], sel = null, lines = [], processingId = null;
const post = (url) => fetch(url, {method: 'POST'}).then(r => r.json());
const esc = s => (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function run(btnId, url, busyLabel) {
  const btn = $('#' + btnId);
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = busyLabel;
  try { await post(url); await load(); }
  finally { btn.disabled = false; btn.textContent = orig; }
}

async function load() {
  $('#busy').classList.add('on');
  const st = $('#status').value, q = $('#q').value;
  const [list, stats] = await Promise.all([
    fetch(`/api/tracks?status=${encodeURIComponent(st)}&q=${encodeURIComponent(q)}`).then(r => r.json()),
    fetch('/api/stats').then(r => r.json())]);
  $('#busy').classList.remove('on');
  tracks = list;
  processingId = stats.processing ? stats.processing.id : null;
  $('#counts').innerHTML = Object.entries(stats.counts).map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('')
    + `<span>queued <b>${stats.queued}</b></span>` + (stats.processing ? `<span>processing <b>${esc(stats.processing.filename)}</b></span>` : '');
  $('#rows').innerHTML = tracks.map(t => `<tr data-id="${t.id}" class="${sel && sel.id === t.id ? 'sel' : ''}">
    <td>${t.id === processingId ? '<span class="st processing">processing…</span>' : `<span class="st ${t.status}">${t.status}</span>`}</td><td>${t.confidence ?? ''}</td><td>${t.path_used ?? ''}${t.path_pref !== 'auto' ? ' *' : ''}</td>
    <td title="${esc(t.folder)}">${esc(t.folder)}</td><td title="${esc(t.filename)}">${esc(t.filename)}</td>
    <td title="${esc(t.parsed_title)} — ${esc(t.parsed_artist)}">${esc(t.parsed_title)}${t.is_variant ? ' ⏩' : ''}${t.is_cover ? ' 🎤' : ''}</td></tr>`).join('');
}

async function select(id) {
  $('#meta').innerHTML = '<div class="loading-msg">loading…</div>';
  $('#actions').hidden = true;
  sel = await fetch(`/api/tracks/${id}`).then(r => r.json());
  document.querySelectorAll('#rows tr').forEach(tr => tr.classList.toggle('sel', +tr.dataset.id === id));
  const info = sel.match_info ? JSON.parse(sel.match_info) : {};
  $('#meta').innerHTML = `<b>${esc(sel.filename)}</b>
    <div>tags: <b>${esc(sel.tag_title)}</b> — ${esc(sel.tag_artist)} · ${Math.round(sel.duration || 0)}s</div>
    <div>parsed: <b>${esc(sel.parsed_title)}</b> — ${esc(sel.parsed_artist || '?')} ${sel.is_variant ? '· shifted variant' : ''} ${sel.is_cover ? '· cover/remix' : ''}</div>
    <div>status: ${sel.id === processingId ? '<span class="st processing">processing…</span>' : `<span class="st ${sel.status}">${sel.status}</span>`} via <b>${sel.path_used ?? '-'}</b> (pref ${sel.path_pref}) conf <b>${sel.confidence ?? '-'}</b></div>
    ${info.track ? `<div>LRCLIB: <b>${esc(info.track)}</b> — ${esc(info.artist)} · orig ${info.orig_duration}s · ratio ${info.ratio}</div>` : ''}
    ${info.language ? `<div>whisper: lang <b>${info.language}</b> · align score ${info.score} · ${info.lines} lines</div>` : ''}
    ${sel.error ? `<div class="err">${esc(sel.error)}</div>` : ''}`;
  $('#actions').hidden = false;
  const p = $('#player'); p.src = `/api/tracks/${id}/audio`; p.load();
  lines = [];
  for (const line of (sel.lyrics || '').split('\n')) {
    const m = line.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
    if (m) lines.push({t: +m[1] * 60 + +m[2], text: m[3]});
  }
  $('#lyrics').innerHTML = lines.length
    ? lines.map((l, i) => `<p data-i="${i}" onclick="seek(${l.t})"><small>${fmt(l.t)}</small>${esc(l.text)}</p>`).join('')
    : '<p>No lyrics yet.</p>';
}

const fmt = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${(t % 60).toFixed(2).padStart(5, '0')}`;
const seek = t => { const p = $('#player'); p.currentTime = t; p.play(); };

$('#player').addEventListener('timeupdate', e => {
  const t = e.target.currentTime;
  let cur = -1;
  for (let i = 0; i < lines.length && lines[i].t <= t; i++) cur = i;
  document.querySelectorAll('#lyrics p').forEach(p => {
    const on = +p.dataset.i === cur;
    if (on && !p.classList.contains('on')) p.scrollIntoView({block: 'center', behavior: 'smooth'});
    p.classList.toggle('on', on);
  });
});

async function reprocess(path) {
  if (!sel) return;
  const btns = document.querySelectorAll('#actions button');
  btns.forEach(b => b.disabled = true);
  try { await post(`/api/tracks/${sel.id}/reprocess?path=${path}`); await load(); }
  finally { btns.forEach(b => b.disabled = false); }
}

$('#rows').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) select(+tr.dataset.id); });
$('#status').addEventListener('change', load);
$('#q').addEventListener('input', () => { clearTimeout(window._t); window._t = setTimeout(load, 250); });
load();
let wasBusy = false;
setInterval(async () => {  // keep statuses fresh while the worker runs, and catch the final refresh once it goes idle
  const s = await fetch('/api/stats').then(r => r.json());
  const busy = !!(s.queued || s.processing);
  if (busy || wasBusy) {
    load();
    if (sel && (sel.id === processingId || sel.status === 'pending')) select(sel.id);
  }
  wasBusy = busy;
}, 4000);
</script>
</body>
</html>
