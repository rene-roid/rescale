# Rescale configuration. Every value can be overridden with an env var:
#   RESCALE_<SECTION>_<KEY>, e.g. RESCALE_LIBRARY_ROOT=/music  RESCALE_TRANSCRIBER_DEVICE=cpu

[paths]
# All generated data (db, caches, model weights, stems, logs). Relative paths resolve from the repo root.
data_dir = "data/"

[library]
# READ ONLY. The only thing ever written here is the lyrics, as a sidecar or in the file's own tag.
# Only seeds the first library: the real list (local folders + SFTP ones) lives in data/config/libraries.json,
# managed from the web UI. `rescale scan --root ...` repoints the first local one.
root = "/home/yuuki/Music"
extensions = [".mp3", ".wav", ".flac", ".m4a", ".ogg", ".opus"]
skip_dirs = [".mp3thumb_backup"]
# How often remote (SFTP) libraries are re-walked in the background for new files. They only ever land as
# `pending` - nothing is sent to the GPU until you press run.
poll_minutes = 15

[matcher]
# Online (LRCLIB) match confidence: >= accept -> matched-online; >= review -> needs-review; else AI path.
accept = 0.85
review = 0.65
# Words in filename/tags that mark a tempo/pitch-shifted variant (timestamps get rescaled).
variant_words = ["nightcore", "sped up", "speed up", "spedup", "slowed", "daycore", "8d", "boosted"]
# Words that mark a re-recording where the original's lyrics would be wrong (always AI path).
cover_words = ["cover", "remix", "swing arrangement", "switching vocals", "rock version"]
# Verify every online candidate against a quick Whisper transcript of the vocal stem, and measure the
# time mapping (speed + trim) from it instead of trusting the duration ratio. Costs ~10 s/track on a GPU;
# turn off on a CPU-only box to keep the online path instant (then variants use the duration ratio).
verify = true
# What the transcript has to share with a candidate's lyrics. Below min_lyric_sim it is a different song
# and the track falls through to the AI path; between the two it is written but flagged `needs-review`,
# with the transcript kept in match_info so the UI can show you what it actually heard.
min_lyric_sim = 0.15
review_lyric_sim = 0.25
# Which path shifted variants prefer when no explicit per-track preference is set: "online" (fetch + rescale) or "ai".
variant_default_path = "online"

[transcriber]
device = "auto"            # auto | cuda | cpu
whisper_model = "large-v3"  # any faster-whisper model name
compute_type = "auto"      # auto -> float16 on cuda, int8 on cpu.
                           # Measured on a 12 GB card: large-v3 costs 3.59G at float16, 1.83G at int8_float16.
                           # Set "int8_float16" to buy ~1.8G of headroom for a small accuracy cost.
batch_size = 8            # VRAM knob: whisper batches share the card with demucs. 12 GB -> 8; drop to 4 if it still OOMs.
# Languages your library actually contains. Detection runs on the loudest 30 s of the vocal stem (the
# first 30 s is usually an instrumental intro, misdetected as Javanese or Khmer); a detection outside
# this list falls back to the first entry. One entry skips detection entirely.
languages = ["en", "ja"]
demucs_model = "htdemucs"
# Keep each track's separated vocal stem in data/stems/ after it has been transcribed. They are
# uncompressed wav - a few hundred MB each, tens of GB over a library - and are only worth keeping if
# you are re-running transcription repeatedly over the same tracks and want to skip Demucs each time.
keep_stems = false
# Mean word alignment score below this -> needs-review instead of ai-transcribed.
review_below = 0.55

[writer]
# Write lyrics into the audio file's own tag (what Navidrome reads) instead of a `<basename>.lrc` sidecar:
# ID3 USLT for mp3/wav, LYRICS for flac/ogg/opus, ©lyr for m4a. Anything else falls back to the sidecar.
embed = true

[tagger]
# Zero-shot audio tagging: genre/mood come from CLAP, tempo from librosa. The candidate labels below
# ARE the taxonomy - CLAP scores the audio against whatever strings you write here, so a subgenre no
# classifier was ever trained on works the same as "pop". Edit the lists to match your library; there
# is nothing to retrain. Runs as its own pass (`rescale tag`), never as part of the lyrics run.
# Any CLAP checkpoint. Not laion/larger_clap_music: its audio and text towers do not share a space in
# transformers (every track embeds ~0.96 alike and scores ~0.00 against every label), so it tags nothing.
model = "laion/larger_clap_music_and_speech"
device = "auto"      # auto | cuda | cpu
windows = 5          # 10 s excerpts spread across the track, averaged. More = steadier on a remix that changes character, and slower.
top_k = 3            # most labels kept per group
min_score = 0.10     # and only those holding this share of the group's probability mass
temperature = 20.0   # how sharply scores separate. Raise for one confident label, lower to see more of the field.
# Tempo a track needs before the audio-side guess is willing to call something nightcore. Ignored when
# the lyrics pipeline measured a real speed ratio against the matched original - that always wins.
nightcore_bpm = 150
# Tempo is reported inside this range, doubling or halving to get there. Half-time and double-time are
# genuinely ambiguous in audio, and a trap-beat nightcore rip reads as 77 BPM as readily as 154; this
# picks the octave rather than leaving it to the track. Widen the low end if your library has real ballads.
bpm_range = [80.0, 175.0]
genres = ["nightcore", "vocaloid", "j-pop", "j-rock", "anime opening", "city pop", "k-pop",
          "pop", "pop punk", "rock", "metal", "acoustic", "piano ballad", "orchestral", "folk",
          "indie", "jazz", "classical", "country", "hip hop", "rap", "r&b", "lo-fi hip hop",
          "electronic", "edm", "future bass", "dubstep", "drum and bass", "hardstyle", "phonk",
          "hyperpop", "house", "techno", "trance", "synthwave", "chiptune"]
moods = ["energetic", "aggressive", "happy", "uplifting", "melancholic", "sad", "dreamy",
         "relaxed", "dark", "romantic", "epic", "playful", "tense", "nostalgic"]
# Write genre, mood and tempo into the file's own tags - TCON/TMOO/TBPM for ID3, "genre"/"mood"/"bpm"
# Vorbis comments, @gen/a freeform atom/tmpo for MP4 - which is what Navidrome reads genre and mood
# from (both multi-valued there) and bpm from. The variant call (nightcore/sped-up/...) has no matching
# field in any of these formats, so it only ever lives in the database. This is only the default for
# `rescale tag`: the web UI's "embed into file" checkbox and the CLI's --embed/--no-embed override it.
# Off here so the library stays read-only apart from lyrics until you ask otherwise.
embed = false

[api]
host = "0.0.0.0"
port = 8765
