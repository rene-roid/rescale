[project]
name = "rescale"
version = "0.1.0"
description = "Time-synced .lrc lyrics for a personal music library (online lookup + rescale, or local AI transcription)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rescale-core",
    "rescale-scanner",
    "rescale-matcher",
    "rescale-rescaler",
    "rescale-transcriber",
    "rescale-writer",
    "rescale-tagger",
    "rescale-api",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rescale-core = { workspace = true }
rescale-scanner = { workspace = true }
rescale-matcher = { workspace = true }
rescale-rescaler = { workspace = true }
rescale-transcriber = { workspace = true }
rescale-writer = { workspace = true }
rescale-tagger = { workspace = true }
rescale-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
